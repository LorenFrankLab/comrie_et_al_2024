[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comrie2024"
version = "0.1.0"
description = "Analysis and figure code for Comrie et al. 2026"
requires-python = ">=3.9"
# Runtime dependencies are managed by the conda env (env/conda_env.yml),
# so they are not pinned here.

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "alison_additional_data_files",
  "alison_behav",
  "alison_decoding",
  "alison_position",
  "alison_rlmodel",
  "alison_subject",
  "decode_helpers",
  "fig_helpers",
  "find_my_data",
  "inspect_additional_data_file",
  "paths",
  "plot_content",
  "plot_decode",
  "plot_decode_1d_to_2d_exs",
  "plot_figs_summary_metrics",
  "plot_rlmodel",
  "rl_helpers",
  "statescriptparse"
]
